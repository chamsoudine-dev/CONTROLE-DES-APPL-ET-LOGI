version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule: { interval: weekly }
    open-pull-requests-limit: 10
  - package-ecosystem: npm
    directory: "/app"
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: "/sdk/ts"
    schedule: { interval: weekly }
  - package-ecosystem: gomod
    directory: "/sdk/go"
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly }
