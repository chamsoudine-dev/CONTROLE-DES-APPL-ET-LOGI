[package]
name = "cc-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
cc-license = { path = "../crates/license" }
cc-core = { path = "../crates/core", default-features = false }
cc-connectors = { path = "../crates/connectors" }
serde_json = "1"
time = "0.3"

[[bin]]
name = "verify_license"
path = "fuzz_targets/verify_license.rs"
test = false
doc = false

[[bin]]
name = "revocation_list"
path = "fuzz_targets/revocation_list.rs"
test = false
doc = false

[[bin]]
name = "ccvault_import"
path = "fuzz_targets/ccvault_import.rs"
test = false
doc = false

[[bin]]
name = "api_responses"
path = "fuzz_targets/api_responses.rs"
test = false
doc = false
