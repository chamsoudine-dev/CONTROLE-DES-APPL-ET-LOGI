[package]
name = "cc-core"
description = "Cœur métier de Control Center : stockage chiffré, crypto, politique, audit, sync"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[features]
default = ["os-keyring"]
# Trousseau du système (desktop). Désactivé sur mobile : fallback chiffré en base.
os-keyring = ["dep:keyring"]

[dependencies]
cc-license = { path = "../license" }
rusqlite = { version = "0.43", features = ["bundled-sqlcipher-vendored-openssl"] }
argon2 = { version = "0.6", features = ["zeroize"] }
chacha20poly1305 = "0.10"
hmac = "0.12"
sha2 = "0.10"
subtle = "2"
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = { version = "1", features = ["derive"] }
totp-rs = { version = "5", features = ["qr", "gen_secret", "otpauth"] }
data-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "serde", "macros"] }
uuid = { version = "1", features = ["v4", "serde"] }
parking_lot = "0.12"
csv = "1"
qrcodegen-image = "1.5"

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
keyring = { version = "3", optional = true, features = ["apple-native", "windows-native", "linux-native-sync-persistent", "crypto-rust"] }

[dev-dependencies]
tempfile = "3"
proptest = "1"
