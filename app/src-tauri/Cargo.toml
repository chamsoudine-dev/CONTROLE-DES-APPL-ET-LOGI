[package]
name = "control-center"
description = "Control Center — centre de contrôle local-first"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[lib]
name = "control_center_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
tauri-plugin-notification = "2"
data-encoding = "2"
tokio = { version = "1", features = ["time", "sync", "rt"] }
time = { version = "0.3", features = ["formatting", "parsing"] }
cc-license = { path = "../../crates/license" }
cc-connectors = { path = "../../crates/connectors" }

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
cc-core = { path = "../../crates/core", features = ["os-keyring"] }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
cc-core = { path = "../../crates/core", default-features = false }
