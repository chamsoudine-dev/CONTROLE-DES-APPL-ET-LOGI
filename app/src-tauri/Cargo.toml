[package]
name = "control-center"
description = "Control Center — centre de contrôle local-first"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[lib]
name = "control_center_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cc-core = { path = "../../crates/core" }
cc-connectors = { path = "../../crates/connectors" }
cc-license = { path = "../../crates/license" }
